services:
  kobra-bridge:
    build: .
    container_name: kobra-bridge
    network_mode: host
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./certs:/app/certs:ro
    environment:
      BRIDGE_HOST_IP: ${BRIDGE_HOST_IP:?Set BRIDGE_HOST_IP to this host's LAN address}
      CAMERA_ENABLED: ${CAMERA_ENABLED:-0}
    restart: unless-stopped
    init: true
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,urllib.request,sys; d=json.load(urllib.request.urlopen('http://127.0.0.1:7125/health',timeout=5)); sys.exit(0 if d.get('ok') else 1)\""]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
